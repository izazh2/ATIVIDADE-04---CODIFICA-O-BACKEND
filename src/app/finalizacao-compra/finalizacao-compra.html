<main class="pagina-finalizacao">

    <h2>Finalizar Compra</h2>
  
    <section class="bloco">
      <h3>Endereço de entrega</h3>
  
      <form (ngSubmit)="finalizarCompra()">
  
        <label for="cep">CEP</label>
        <input
          type="text"
          id="cep"
          name="cep"
          [(ngModel)]="endereco.cep"
          required
        >
  
        <label for="rua">Rua</label>
        <input
          type="text"
          id="rua"
          name="rua"
          [(ngModel)]="endereco.rua"
          required
        >
  
        <label for="numero">Número</label>
        <input
          type="text"
          id="numero"
          name="numero"
          [(ngModel)]="endereco.numero"
          required
        >
  
        <label for="complemento">Complemento</label>
        <input
          type="text"
          id="complemento"
          name="complemento"
          [(ngModel)]="endereco.complemento"
        >
  
        <label for="bairro">Bairro</label>
        <input
          type="text"
          id="bairro"
          name="bairro"
          [(ngModel)]="endereco.bairro"
          required
        >
  
        <label for="cidade">Cidade</label>
        <input
          type="text"
          id="cidade"
          name="cidade"
          [(ngModel)]="endereco.cidade"
          required
        >
  
        <h3>Forma de pagamento</h3>
  
        <select
          name="formaPagamento"
          [(ngModel)]="formaPagamento"
          required
        >
          <option value="">Selecione uma opção</option>
          <option value="PIX">PIX</option>
          <option value="Cartão de crédito">Cartão de crédito</option>
          <option value="Cartão de débito">Cartão de débito</option>
          <option value="Dinheiro">Dinheiro</option>
        </select>
  
        <h3>Resumo do pedido</h3>
  
        @for (produto of itens; track $index) {
          <div class="produto-resumo">
            <span>{{ produto.nome }}</span>
            <strong>{{ produto.preco | currency:'BRL' }}</strong>
          </div>
        }
  
        <div class="total">
          <span>Total:</span>
          <strong>{{ calcularTotal() | currency:'BRL' }}</strong>
        </div>
  
        <button type="submit" [disabled]="itens.length === 0">
          Confirmar pedido
        </button>
  
      </form>
    </section>
  
  </main>
