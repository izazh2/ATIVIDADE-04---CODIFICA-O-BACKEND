
<section class="pagina-agendamento">

    <h1>Agendar Serviço</h1>
  
    <p class="descricao">
      Escolha o procedimento, a data e o horário desejado.
    </p>
  
    <form (ngSubmit)="confirmarAgendamento()">
  
      <div class="campo">
        <label for="servico">Escolha o serviço:</label>
  
        <select
          id="servico"
          name="servico"
          [(ngModel)]="agendamento.servico"
          required
        >
          <option value="">Selecione um serviço</option>
  
          @for (servico of servicos; track servico.id) {
            <option [value]="servico.nome">
              {{ servico.nome }} - {{ servico.preco | currency:'BRL' }}
            </option>
          }
  
        </select>
      </div>
  
      <div class="campo">
        <label for="data">Escolha a data:</label>
  
        <input
          type="date"
          id="data"
          name="data"
          [(ngModel)]="agendamento.data"
          [min]="hoje"
          required
        >
      </div>
  
      <div class="campo">
        <label for="horario">Escolha o horário:</label>
  
        <select
          id="horario"
          name="horario"
          [(ngModel)]="agendamento.horario"
          required
        >
          <option value="">Selecione um horário</option>
  
          @for (horario of horarios; track horario) {
            <option [value]="horario">{{ horario }}</option>
          }
  
        </select>
      </div>
  
      <div class="campo">
        <label for="observacoes">Observações:</label>
  
        <textarea
          id="observacoes"
          name="observacoes"
          [(ngModel)]="agendamento.observacoes"
          placeholder="Escreva alguma observação, se necessário"
        ></textarea>
      </div>
  
      <button type="submit">Solicitar agendamento</button>
  
    </form>
  
  </section>
