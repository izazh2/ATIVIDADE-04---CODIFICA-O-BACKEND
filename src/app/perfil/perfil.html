<main class="pagina-perfil">

    <section class="formulario-perfil">
  
      <h2>Meu Perfil</h2>
      <p>Consulte e atualize seus dados pessoais.</p>
  
      <form (ngSubmit)="salvarAlteracoes()">
  
        <label for="nome">Nome completo</label>
        <input
          type="text"
          id="nome"
          name="nome"
          [(ngModel)]="cliente.nome"
          required
        >
  
        <label for="cpf">CPF</label>
        <input
          type="text"
          id="cpf"
          name="cpf"
          [(ngModel)]="cliente.cpf"
          required
        >
  
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="cliente.email"
          required
        >
  
        <label for="telefone">Telefone</label>
        <input
          type="tel"
          id="telefone"
          name="telefone"
          [(ngModel)]="cliente.telefone"
          required
        >
  
        <button type="submit">Salvar alterações</button>
  
      </form>
  
    </section>
  
  </main>
